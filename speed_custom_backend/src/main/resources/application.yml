server:
  port: ${CUSTOM_PORT:48081}
spring:
  application:
    name: speed-custom-backend
  profiles:
    active: ${CUSTOM_PROFILE:test}
  datasource:
    url: ${CUSTOM_DB_URL:jdbc:mysql://127.0.0.1:3306/speednet?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${CUSTOM_DB_USER:root}
    password: ${CUSTOM_DB_PASSWORD:}
  flyway:
    enabled: true
    table: custom_flyway_schema_history
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${CUSTOM_SMTP_HOST:localhost}
    port: ${CUSTOM_SMTP_PORT:25}
    username: ${CUSTOM_SMTP_USER:}
    password: ${CUSTOM_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${CUSTOM_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${CUSTOM_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
custom:
  tenant-id: ${CUSTOM_TENANT_ID:1}
  mail-from: ${CUSTOM_MAIL_FROM:no-reply@example.com}
  dev-return-code: ${CUSTOM_DEV_RETURN_CODE:false}
  cors-origin: ${CUSTOM_CORS_ORIGIN:http://localhost:5173}

  backend-url: ${CUSTOM_BACKEND_URL:http://127.0.0.1:48080}
